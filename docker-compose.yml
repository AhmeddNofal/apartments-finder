version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: apartments-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./apartments-api
    container_name: apartments-backend
    restart: always
    environment:
      MONGO_URI: "mongodb://mongo:27017/apartments"
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  frontend:
    build: ./apartments-app
    container_name: apartments-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongo-data:
